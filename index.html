  /* SEARCH */
  .search-wrap{position:relative;width:280px;flex-shrink:0}
  .search-input{
    width:100%;padding:8px 14px 8px 36px;border-radius:8px;border:1.5px solid rgba(255,255,255,.12);

  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:.82rem;opacity:.4}
  .search-results{
    position:absolute;top:calc(100% + 6px);left:0;right:0;background:#1B2B44;
    border:1px solid rgba(255,255,255,.1);border-radius:10px;max-height:320px;overflow-y:auto;
    display:none;box-shadow:0 12px 32px rgba(0,0,0,.4);z-index:2000;
  }
  .search-results.open{display:block}
  .sr-item{
    padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06);
    transition:background .15s;
  }
  .sr-item:hover{background:rgba(255,255,255,.06)}
  .sr-item:last-child{border-bottom:none}
  .sr-name{font-size:.82rem;font-weight:800;color:#fff}
  .sr-city{font-size:.68rem;color:rgba(255,255,255,.5);margin-top:1px}
  .sr-type{font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:2px 6px;border-radius:4px;display:inline-block;margin-top:4px}
  .sr-type.b2x{background:rgba(0,113,206,.2);color:#60A5FA}
  .sr-type.wm{background:rgba(124,58,237,.2);color:#C4B5FD}
  .sr-empty{padding:16px;text-align:center;color:rgba(255,255,255,.3);font-size:.78rem}

  /* LEGEND BAR */
  .legend-bar{
    background:#001E3D;padding:8px 28px;display:flex;align-items:center;gap:24px;
    border-bottom:1px solid rgba(255,255,255,.06);

  .legend-item{display:flex;align-items:center;gap:7px;font-size:.7rem;font-weight:600;color:rgba(255,255,255,.6)}
  .legend-dot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
  .legend-count{font-weight:800;color:rgba(255,255,255,.9)}
  .legend-stat{margin-left:auto;font-size:.68rem;font-weight:700;color:rgba(255,255,255,.4)}
  .legend-stat strong{color:#FFC220}

  /* MAP */
  #map{width:100%;height:calc(100vh - 68px - 37px)}

  /* POPUPS */
  .leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);border:1px solid #E2E8F0;padding:0}
  .leaflet-popup-content{margin:0;min-width:220px}
  .popup{padding:14px 16px}
  .pn{font-size:.95rem;font-weight:800;color:#002D58;margin-bottom:2px}
  .pc{font-size:.78rem;font-weight:600;color:#475569}
  .pa{font-size:.68rem;color:#94A3B8;margin-top:2px}
  .pt{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;

  .pt.b2x{background:#EFF6FF;color:#0071CE}
  .pt.wm{background:#F5F3FF;color:#7C3AED}
  .pd{font-size:.72rem;font-weight:700;color:#002D58;margin-top:6px}

  .leaflet-control-zoom a{
    background:#002D58!important;color:#FFC220!important;
    border-color:rgba(255,255,255,.1)!important;font-weight:800
  }
  .leaflet-control-zoom a:hover{background:#003A6E!important}

  var startHtml = s.start ? '<div class="pd">Install Start: ' + s.start + '</div>' : '';
  var m = L.circleMarker([s.lat, s.lng], {radius:9, fillColor:color, color:border, weight:2.5, fillOpacity:0.9})

});

// Search
var input = document.getElementById("searchInput");
var results = document.getElementById("searchResults");

input.addEventListener("input", function(){
  var q = this.value.toLowerCase().trim();
  if(!q){ results.classList.remove("open"); results.innerHTML=""; return; }
  var matches = stores.filter(function(s){
    return s.n.toLowerCase().includes(q) || s.city.toLowerCase().includes(q) || s.addr.toLowerCase().includes(q);
  }).slice(0,8);
  if(!matches.length){
    results.innerHTML='<div class="sr-empty">No stores found</div>';
    results.classList.add("open"); return;
  }
  results.innerHTML = matches.map(function(s){
    var cls = s.type === "b2x" ? "b2x" : "wm";
    return '<div class="sr-item" data-store="' + s.n + '"><div class="sr-name">' + s.n + '</div><div class="sr-city">' + s.city + ' â€” ' + s.addr + '</div><div class="sr-type ' + cls + '">' + s.label + '</div></div>';
  }).join("");
  results.classList.add("open");
});

results.addEventListener("click", function(e){
  var item = e.target.closest(".sr-item");
  if(!item) return;
  var name = item.dataset.store;
  var entry = markers[name];
  if(entry){
    map.setView([entry.data.lat, entry.data.lng], 12);
    entry.marker.openPopup();
  }
  results.classList.remove("open");
  input.value = name;
});

document.addEventListener("click", function(e){
  if(!e.target.closest(".search-wrap")) results.classList.remove("open");
