<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f0f2f5; }
  #header {
    background: linear-gradient(135deg, #002D58 0%, #004080 100%);
    padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;

    box-shadow: 0 2px 8px rgba(0,0,0,.15); font-size: 12px; line-height: 1.8;

  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .store-popup { font-family: 'Segoe UI', system-ui, sans-serif; }
  .store-popup h3 { font-size: 14px; color: #002D58; margin-bottom: 4px; }
  .store-popup p { font-size: 12px; color: #555; margin: 2px 0; }
  .store-popup .scope-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 10px; font-weight: 700; margin-top: 4px;
  }
  .scope-b2x { background: rgba(0,113,206,.1); color: #0071CE; }
  .scope-rl { background: rgba(124,58,237,.1); color: #7C3AED; }

      <path d="M262 104.2C259.8 102.9 256.9 103.7 255.6 106C254.3 108.2 255.1 111.1 257.3 112.4C258.3 113 269.3 118 270.6 118.3C272 118.6 273.5 117.9 274.2 116.7C274.9 115.5 274.7 113.9 273.7 112.8C272.9 111.8 263 104.8 262 104.2Z" fill="#FFC220"/>

    </svg>
    <div>
      <h1>EdgeSense Gen 2 -> Gen 3 Conversion Program</h1>
      <div class="sub">45 Stores Â· Live Deployment Tracking</div>
    </div>
  </div>
  <input type="text" id="search-box" placeholder="Search stores..." />

<div id="map"></div>

<script>
// Walmart Spark SVG as marker icon
const sparkSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="254 91 54 60">
  <circle cx="281" cy="121" r="26" fill="COLOR" fill-opacity="0.15"/>
  <path d="M292.4 118.3C293.7 118 304.7 113 305.7 112.4C307.9 111.1 308.7 108.2 307.4 106C306.1 103.7 303.2 102.9 301 104.2C300 104.8 290.1 111.8 289.2 112.8C288.3 113.9 288.1 115.5 288.8 116.7C289.5 117.9 291 118.6 292.4 118.3Z" fill="COLOR"/>
  <path d="M305.7 129.5C304.7 128.9 293.7 123.9 292.4 123.6C291 123.3 289.5 123.9 288.8 125.2C288.1 126.4 288.3 128 289.2 129.1C290.1 130 300 137.1 301 137.6C303.2 138.9 306.1 138.2 307.4 135.9C308.7 133.7 307.9 130.8 305.7 129.5Z" fill="COLOR"/>
  <path d="M281.5 129.4C280.1 129.4 278.8 130.3 278.3 131.7C277.9 132.9 276.8 145 276.8 146.2C276.8 148.8 278.9 150.9 281.5 150.9C284.1 150.9 286.2 148.8 286.2 146.2C286.2 145 285.1 132.9 284.7 131.7C284.2 130.3 282.9 129.4 281.5 129.4Z" fill="COLOR"/>
  <path d="M270.6 123.6C269.3 123.9 258.3 128.9 257.3 129.5C255.1 130.8 254.3 133.7 255.6 135.9C256.9 138.2 259.8 138.9 262 137.6C263 137.1 272.9 130 273.7 129.1C274.7 128 274.9 126.4 274.2 125.2C273.5 123.9 272 123.3 270.6 123.6Z" fill="COLOR"/>
  <path d="M262 104.2C259.8 102.9 256.9 103.7 255.6 106C254.3 108.2 255.1 111.1 257.3 112.4C258.3 113 269.3 118 270.6 118.3C272 118.6 273.5 117.9 274.2 116.7C274.9 115.5 274.7 113.9 273.7 112.8C272.9 111.8 263 104.8 262 104.2Z" fill="COLOR"/>
  <path d="M281.5 91C278.9 91 276.8 93.1 276.8 95.7C276.8 96.8 277.9 108.9 278.3 110.1C278.8 111.5 280.1 112.5 281.5 112.5C282.9 112.5 284.2 111.5 284.7 110.1C285.1 108.9 286.2 96.8 286.2 95.7C286.2 93.1 284.1 91 281.5 91Z" fill="COLOR"/>
</svg>`;

function makeIcon(color) {
  const svg = sparkSvg.replace(/COLOR/g, color);
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -14],
  });
}

const blueIcon = makeIcon('#0071CE');
const purpleIcon = makeIcon('#7C3AED');

const map = L.map('map').setView([37.5, -96], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 18,
}).addTo(map);

// Store data: [name, city, lat, lng, scope]
const stores = [
  ["#2082","Cerritos, CA",33.8583,-118.0648,"B2X"],
  ["#2667","Dallas, TX",32.7767,-96.7970,"B2X"],
  ["#3431","Hudson Oaks, TX",32.7570,-97.6959,"B2X"],
  ["#3631","Crowley, TX",32.5793,-97.3625,"B2X"],
  ["#3284","Arlington, TX",32.7357,-97.1081,"B2X"],
  ["#4279","Midlothian, TX",32.4824,-96.9945,"B2X"],
  ["#5359","Azle, TX",32.8951,-97.5458,"B2X"],
  ["#5288","Seagoville, TX",32.6365,-96.5375,"B2X"],
  ["#371","Granbury, TX",32.4419,-97.7281,"B2X"],
  ["#384","Lumberton, TX",30.2666,-94.2002,"B2X"],
  ["#396","Anderson, SC",34.5034,-82.6501,"B2X"],
  ["#427","Greenville, TX",33.1384,-96.1108,"B2X"],
  ["#516","Gun Barrel City, TX",32.3343,-96.1186,"B2X"],
  ["#872","Pearland, TX",29.5636,-95.2861,"B2X"],
  ["#963","Weatherford, TX",32.7593,-97.7972,"B2X"],
  ["#980","Greeley, CO",40.4233,-104.7091,"B2X"],
  ["#1225","Orange Park, FL",30.1705,-81.7106,"B2X"],
  ["#1535","Sioux Falls, SD",43.5446,-96.7311,"B2X"],
  ["#1560","Las Vegas, NV",36.0830,-115.1530,"B2X"],
  ["#1770","Cranberry Twp, PA",40.6850,-80.1070,"B2X"],
  ["#2135","Cobleskill, NY",42.6779,-74.4854,"B2X"],
  ["#5063","Charlotte, NC",35.1270,-80.5140,"B2X"],
  ["#5435","San Jose, CA",37.3200,-121.8630,"B2X"],
  ["#7178","Princeton, TX",33.1801,-96.4980,"B2X"],
  ["#2104","Newburgh, NY",41.5034,-74.0104,"RL"],
  ["#2637","Monroe, NY",41.3309,-74.1871,"RL"],
  ["#3594","Pantego, TX",32.7143,-97.1570,"RL"],
  ["#202","Frisco, TX",33.1507,-96.8236,"RL"],
  ["#6300","Prosper, TX",33.2362,-96.8003,"RL"],
  ["#272","Franklin, TN",35.9251,-86.8689,"RL"],
  ["#1554","Stockton, CA",37.9577,-121.2908,"RL"],
  ["#1255","Laurinburg, NC",34.7743,-79.4620,"RL"],
  ["#2884","Las Vegas, NV",36.2700,-115.2240,"RL"],
  ["#266","Grapevine, TX",32.9343,-97.0781,"RL"],
  ["#2980","Fort Worth, TX",32.8880,-97.3180,"RL"],
  ["#3777","Frisco, TX",33.1290,-96.8530,"RL"],
  ["#220","Burleson, TX",32.5420,-97.3208,"RL"],
  ["#228","Cleburne, TX",32.3477,-97.3867,"RL"],
  ["#3654","Rogers, AR",36.3320,-94.1185,"RL"],
  ["#265","Terrell, TX",32.7357,-96.2753,"RL"],
  ["#804","Mineral Wells, TX",32.8084,-98.0678,"RL"],
  ["#896","Grand Prairie, TX",32.6821,-97.0038,"RL"],
  ["#2978","Fort Worth, TX",32.6565,-97.3810,"RL"],
  ["#5210","Wylie, TX",33.0151,-96.5389,"RL"],
  ["#1608","Red Bluff, CA",40.1785,-122.2358,"RL"],
];

const markers = [];

stores.forEach(([name, city, lat, lng, scope]) => {
  const icon = scope === "B2X" ? blueIcon : purpleIcon;
  const scopeClass = scope === "B2X" ? "scope-b2x" : "scope-rl";
  const scopeLabel = scope === "B2X" ? "B2X Conversion + RL" : "Reverse Logistics Only";
  const m = L.marker([lat, lng], { icon })
    .bindPopup(`<div class="store-popup">
      <h3>Store ${name}</h3>
      <p>${city}</p>
      <span class="scope-badge ${scopeClass}">${scopeLabel}</span>
    </div>`)
    .addTo(map);
  m._storeData = { name, city };
  markers.push(m);
});

// Search
document.getElementById('search-box').addEventListener('input', function(e) {
  const q = e.target.value.toLowerCase();
  markers.forEach(m => {
    const match = m._storeData.name.toLowerCase().includes(q) || m._storeData.city.toLowerCase().includes(q);
    m.setOpacity(match || !q ? 1 : 0.15);
    if (match && q.length > 1) { m.openPopup(); }
  });
  if (!q) markers.forEach(m => m.closePopup());
});

// Legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<strong>Store Types</strong><br>' +
    '<span class="legend-dot" style="background:#0071CE"></span> B2X Conversion + RL (24)<br>' +
    '<span class="legend-dot" style="background:#7C3AED"></span> Reverse Logistics Only (21)';
  return div;
};
legend.addTo(map);
</script>
